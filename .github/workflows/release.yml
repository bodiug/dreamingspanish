name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="$GITHUB_REF_NAME"
          else
            RANGE="$PREV_TAG..$GITHUB_REF_NAME"
          fi
          {
            echo "## $GITHUB_REF_NAME"
            echo ""
            git log "$RANGE" --no-merges --pretty=format:"- %s (%h)"
          } > release-notes.md
          cat release-notes.md

      - name: Update CHANGELOG.md
        run: |
          {
            head -n 1 CHANGELOG.md
            echo ""
            cat release-notes.md
            echo ""
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.new.md
          mv CHANGELOG.new.md CHANGELOG.md

      - name: Commit changelog back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog for $GITHUB_REF_NAME" || echo "Nothing to commit"
          git push origin HEAD:master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
